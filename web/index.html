<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuscultaDB — Respiratory & Cardiac Sound Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Redesign 2026-11: neutral ink chrome so the data colours (finding types, current = blue,
     baseline = green) are the only saturated things on screen. */
  --bg:#f3f5f8;--panel:#ffffff;--panel-2:#f8fafc;--line:#e4e8ef;--line-2:#d5dbe5;
  --ink:#0e1726;--muted:#55637a;--soft:#8592a6;
  --side:#0b1220;--side-2:#131c2e;--side-ink:#c9d3e3;--side-mute:#7c8aa3;
  --accent:#0f6fde;--accent-ink:#0b4ea0;--accent-soft:#e8f1fd;--accent-line:#bcd5f6;
  --cur:#0f6fde;--ok:#1f9d55;--warn:#d9822b;--bad:#d64545;
  --insp:rgba(15,111,222,.10);--exp:rgba(217,130,43,.10);
  --radius:14px;--radius-s:9px;--shadow:0 1px 2px rgba(14,23,38,.04),0 2px 8px rgba(14,23,38,.04);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--side-w:236px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* app shell: a fixed left rail on desktop, a compact top bar under 900 px */
header{position:fixed;inset:0 auto 0 0;width:var(--side-w);z-index:20;background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#fff;letter-spacing:-.01em;padding:2px 6px 8px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--side-mute);letter-spacing:0}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1f9d55,#0f6fde);display:grid;place-items:center;color:#fff;flex:none}
header nav{display:flex;flex-direction:column;gap:2px}
header nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-s);color:var(--side-ink);font-weight:500}
header nav a svg{width:17px;height:17px;flex:none;opacity:.75}
header nav a:hover{background:var(--side-2);color:#fff}
header nav a.active{background:#fff;color:var(--ink)}header nav a.active svg{opacity:1}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mute);padding:6px 10px 2px;font-weight:600}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--side-2);border:1px solid #223050;border-radius:var(--radius-s);padding:7px 10px;color:var(--side-mute)}
.search svg{width:15px;height:15px;flex:none}
.search input{border:0;background:transparent;outline:0;font:inherit;width:100%;color:#fff}
.search input::placeholder{color:var(--side-mute)}
header .btn.primary{justify-content:center;background:var(--cur);border-color:var(--cur)}
.stamp{color:#9fb0c9;margin-bottom:8px;font-family:var(--mono);font-size:10.5px}
.stamp::before{content:'●';color:#1f9d55;margin-right:5px}
.sidefoot{font-size:11px;color:var(--side-mute);line-height:1.45;padding:0 6px}
main{margin-left:var(--side-w);max-width:1320px;padding:28px 34px}
footer{margin-left:var(--side-w)}
@media(max-width:900px){
  header{position:sticky;inset:auto;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px;gap:8px}
  .brand{padding:0}.brand small,.navlabel,.sidefoot,header .spacer{display:none}
  header nav{flex-direction:row;overflow-x:auto;order:3;width:100%}header nav a{white-space:nowrap;padding:6px 10px}
  .search{flex:1;min-width:140px}
  main,footer{margin-left:0}main{padding:18px 16px}
}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:15.5px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;max-width:900px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.card>h2:first-child,.card>.row:first-child h2{font-size:15px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:var(--radius-s);padding:7px 12px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel-2);border-color:#c3cbd8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.btn.primary.active{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.btn.active:not(.primary){box-shadow:inset 0 0 0 1px var(--accent-line)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:#eef1f5;color:var(--muted)}
.pill.ok{background:#e4f6ec;color:#176b3c}.pill.bad{background:#fde8e8;color:#9f2b2b}.pill.warn{background:#fdf0e3;color:#8a4e12}.pill.info{background:#eaf2fd;color:var(--accent-ink)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);text-align:left;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel-2)}
.mono{font-family:var(--mono);font-size:12.5px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--soft)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.grid>*{min-width:0}
.avatar{width:36px;height:36px;border-radius:10px;background:#dfe8f5;font-size:13px;color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.avatar.doc{background:#e5f3ea;color:#176b3c}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.list-item:hover{background:var(--panel-2)}
.list-item .meta{color:var(--muted);font-size:12.5px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* expert label = filled square · detector output = hollow ring. Same hue, different mark, so a
   disagreement between the two is legible at a glance instead of needing the surrounding words. */
.swatch.det{background:transparent!important;border-radius:50%;box-shadow:inset 0 0 0 2.5px currentColor}
.lamp.det{background:transparent!important;box-shadow:inset 0 0 0 2.5px currentColor}
.markkey{display:inline-flex;gap:12px;align-items:center;font-size:11px;color:#8b97a5;margin-left:auto}
/* Discoveries is 15 long sections; the analysis map promised navigation it never delivered.
   This rail stays put while you scroll and marks where you are. */
.toc{position:sticky;top:0;border-radius:0 0 var(--radius-s) var(--radius-s);z-index:5;background:#fbfcfdee;backdrop-filter:blur(6px);border-bottom:1px solid #e1e6ed;
     margin:0 0 14px;padding:8px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.toc a{flex:0 0 auto;font-size:11.5px;padding:4px 9px;border-radius:999px;text-decoration:none;color:#5d6b7a;
       background:#eef1f5;white-space:nowrap;border:1px solid transparent}
.toc a:hover{background:#e3e9f1;color:#15202b}
.toc a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toc a.pending{opacity:.55;font-style:italic}
.markkey i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.player{display:flex;flex-direction:column;gap:10px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
canvas.graph{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:crosshair}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.ghostline{display:inline-block;width:22px;height:0;border-top:2px dashed #7c8a99}
.solidline{display:inline-block;width:22px;height:0;border-top:3px solid var(--cur)}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:110px}
.finding{border-left:4px solid var(--line);padding:8px 12px;margin-bottom:8px;background:#fbfcfd;border-radius:0 8px 8px 0;cursor:pointer}
.finding:hover{background:#f3f6fa}
.finding .t{font-weight:600}
.finding .d{color:var(--muted);font-size:12.5px}
.finding .mono{color:var(--soft)}
.badge-n{font-family:var(--mono);font-size:11px;background:#eef1f5;border-radius:6px;padding:1px 6px;color:var(--muted)}
.empty{color:var(--soft);text-align:center;padding:32px}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(560px,94vw);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;background:#fff}
textarea.f{min-height:60px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#15202b;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;letter-spacing:-.02em}.stat span{font-size:12px;color:var(--soft)}
.rec-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcfd}
.rec-card h3{display:flex;align-items:center;gap:8px}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#eef1f5;color:var(--muted);font-weight:600}
.hint{font-size:12px;color:var(--soft)}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.src{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap}
.src.real{background:#e4f6ec;color:#176b3c}.src.syn{background:#f1eefc;color:#5b3fb0}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--bad);font-weight:700}
.cm td,.cm th{text-align:center}.cm td.diag{background:#e4f6ec;font-weight:700}
.lane{border:1px solid var(--line);border-radius:10px;padding:8px 10px 4px;background:#fff;position:relative}
.lane.ghost{background:#fafbfc}
.lane .lhead{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:4px}
.lane .lhead b{font-size:13px}.lane.driving{box-shadow:0 0 0 2px #bcd5f6}
.livegrid{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:12px}
@media(max-width:1000px){.livegrid{grid-template-columns:1fr}}
.livebox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.livebox h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin:0 0 6px}
.livebox canvas{width:100%;height:150px;display:block;border-radius:6px}
/* The live readouts rewrite their text every frame. Fixed canvas heights and a reserved, clamped
   height for each readout keep the three boxes from resizing (and the page from bouncing) during play. */
.livegrid{align-items:start}
.ind dd{font-variant-numeric:tabular-nums}
.ind dd,.ind dd .hint{overflow:hidden;text-overflow:ellipsis}
#iTime,#iPhase,#iFind,#iCrkTxt,#iExp{white-space:nowrap;display:block}
#iTonTxt,#iDiffTxt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;min-height:2.9em;line-height:1.45}
.ind dd:has(> .lamp){display:flex;align-items:center;min-width:0}
.ind dd:has(> .lamp) .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ind{display:grid;grid-template-columns:86px minmax(0,1fr);gap:5px 8px;font-size:12.5px;align-items:center}
.ind dt{color:var(--soft)}.ind dd{margin:0;min-width:0}
.meter{height:9px;border-radius:5px;background:#eef1f5;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .08s linear}
.meter .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:#15202b;opacity:.5}
.lamp{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d7dde5;margin-right:5px;vertical-align:-1px;transition:background .1s}
.zoomctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.notice{background:#fff8e6;border:1px solid #f3dca4;border-radius:10px;padding:10px 12px;font-size:13px;color:#6b4e0e}
.sr-only{position:absolute;left:-9999px}
.phase-key{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px}
footer{color:var(--soft);font-size:12px;text-align:center;padding:24px 34px 18px;max-width:1320px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi b{display:block;font-size:clamp(20px,2.2vw,28px);letter-spacing:-.03em;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--k,var(--ink))}
.avatar.s-sprsound{background:#e3eefc;color:#0b4ea0}.avatar.s-kauh{background:#e6f5ec;color:#176b3c}.avatar.s-circor{background:#fde8f1;color:#a3245c}
.who{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.tablecard{padding:0;overflow:hidden}.tablecard table{margin:0}.tablecard tr:last-child td{border-bottom:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select{border:1px solid var(--line-2);border-radius:var(--radius-s);padding:7px 10px;background:#fff;font:inherit}
.ptgrid{grid-template-columns:320px minmax(0,1fr)}
@media(max-width:1180px){.ptgrid{grid-template-columns:1fr}}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.crumb:hover{color:var(--ink)}
.ptgrid>div:first-child .kv{grid-template-columns:1fr;gap:0}
.ptgrid>div:first-child .kv dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.ptgrid>div:first-child .kv dt:first-child{margin-top:0}
.bedside{margin:6px 0 10px;padding-left:20px}
.vrep td.mono{white-space:nowrap}.bedside li{margin:3px 0}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">∿</div><div>AuscultaDB<small>open auscultation research</small></div></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search patients…" aria-label="Search patients (name, MRN, diagnosis)"></div>
  <nav>
    <div class="navlabel">Clinical</div>
    <a href="#patients" id="nav-patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M21 19v-1a4 4 0 0 0-3-3.9M15.5 4.1a3.5 3.5 0 0 1 0 6.8"/></svg>Patients</a>
    <a href="#doctors" id="nav-doctors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M10 21v-5h4v5"/><path d="M12 8v4M10 10h4"/></svg>Recording sites</a>
    <div class="navlabel">Research</div>
    <a href="#discover" id="nav-discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/></svg>Discoveries</a>
    <a href="#validation" id="nav-validation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>Validation</a>
    <a href="#longevity" id="nav-longevity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Longevity</a>
    <a href="#datasets" id="nav-datasets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Datasets &amp; licences</a>
  </nav>
  <button class="btn primary" id="btnAdd">+ New patient (upload)</button>
  <div class="spacer"></div>
  <div class="sidefoot"><div id="dataStamp" class="stamp">loading data…</div>Decision support for research and teaching — not a diagnostic device.</div>
</header>
<main id="view"></main>
<footer id="footer"></footer>

<div class="modal-bg" id="modal"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/wavesurfer.js@7.12.12/dist/plugins/regions.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7.12.12/dist/plugins/spectrogram.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7.12.12/dist/plugins/timeline.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7.12.12/dist/plugins/minimap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meyda@5.6.3/dist/web/meyda.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
<script>
/* =====================================================================
   0. Constants, utilities
   ===================================================================== */
const SR = 8000;           // sample rate of all analysed audio
const SYN_DUR = 12;        // seconds per synthetic recording
let DUR = 12;              // duration of the recording(s) currently being analysed / displayed
const TYPES = {
  fine_crackle:  {label:'Fine crackles',           color:'#d64545', kind:'discontinuous'},
  coarse_crackle:{label:'Coarse crackles',         color:'#b5451b', kind:'discontinuous'},
  wheeze:        {label:'Wheeze',                  color:'#8e44ad', kind:'continuous'},
  rhonchus:      {label:'Rhonchi',                 color:'#6c5ce7', kind:'continuous'},
  stridor:       {label:'Stridor',                 color:'#c0392b', kind:'continuous'},
  rub:           {label:'Pleural friction rub',    color:'#d9822b', kind:'discontinuous'},
  murmur:        {label:'Systolic murmur',         color:'#e84393', kind:'cardiac'},
  dmurmur:       {label:'Diastolic murmur',        color:'#e84393', kind:'cardiac'},
  s3:            {label:'S3 gallop',               color:'#0984e3', kind:'cardiac'},
  prolonged_exp: {label:'Prolonged expiration',    color:'#2d9c6f', kind:'pattern'},
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = t => t.toFixed(2) + ' s';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function median(arr){if(!arr.length)return 0;const a=Array.from(arr).sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}

/* =====================================================================
   2. Audio synthesis — physiologically modelled auscultation sounds
   ===================================================================== */
function biquad(type, fc, Q){
  const w0=2*Math.PI*fc/SR, cw=Math.cos(w0), sw=Math.sin(w0), a=sw/(2*Q); let b0,b1,b2,a0,a1,a2;
  if(type==='bp'){b0=a;b1=0;b2=-a;a0=1+a;a1=-2*cw;a2=1-a}
  else if(type==='lp'){b0=(1-cw)/2;b1=1-cw;b2=(1-cw)/2;a0=1+a;a1=-2*cw;a2=1-a}
  else {b0=(1+cw)/2;b1=-(1+cw);b2=(1+cw)/2;a0=1+a;a1=-2*cw;a2=1-a}
  b0/=a0;b1/=a0;b2/=a0;a1/=a0;a2/=a0;
  return x=>{const y=new Float32Array(x.length);let x1=0,x2=0,y1=0,y2=0;for(let i=0;i<x.length;i++){const v=b0*x[i]+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=x[i];y2=y1;y1=v;y[i]=v}return y}
}
function breathTiming(p, kind){
  const T=60/p.rr, ie=(kind==='path'&&p.pathIE)?p.pathIE:p.ie;
  const tIn=T*ie/(1+ie);
  const tEx=Math.min(T-tIn-0.55,(T-tIn)*0.85);
  return {T,tIn,tEx};
}
function addDamped(out, t0, f, tau, amp, rng){
  const n=Math.floor(tau*6*SR), i0=Math.floor(t0*SR), ph=rng?rng()*Math.PI:0;
  for(let i=0;i<n&&i0+i<out.length;i++){const t=i/SR;out[i0+i]+=amp*Math.exp(-t/tau)*Math.sin(2*Math.PI*f*t+ph)}
}
function synthRecording(p, kind){
  const rng=mulberry32(p.seed*7919+(kind==='normal'?1:2));
  const N=SR*SYN_DUR, out=new Float32Array(N);
  const {T,tIn,tEx}=breathTiming(p,kind);
  // --- vesicular breath sounds: band-limited noise with phase envelope
  const white=new Float32Array(N); for(let i=0;i<N;i++)white[i]=rng()*2-1;
  const breath=biquad('bp',320,0.55)(white);
  const exhale=biquad('lp',500,0.7)(breath);
  for(let i=0;i<N;i++){
    const t=i/SR,u=t%T; let e=0;
    if(u<tIn) e=Math.pow(Math.sin(Math.PI*u/tIn),0.7);
    else if(u<tIn+tEx) e=0.5*Math.pow(Math.sin(Math.PI*(u-tIn)/tEx),0.7);
    out[i]+= (u<tIn?breath[i]:exhale[i]) * e * 0.9 + white[i]*0.004;
  }
  // --- heart sounds
  const P=60/p.hr, s2off=0.30*Math.sqrt(P/0.8);
  const path=kind==='path'?p.pathology:[];
  const hasMurmur=path.find(x=>x.type==='murmur'), hasS3=path.find(x=>x.type==='s3');
  const murNoise=hasMurmur?biquad('bp',260,1.1)(white):null;
  for(let k=0;k*P<SYN_DUR;k++){
    const t1=k*P+0.22;
    addDamped(out,t1,46,0.034,p.heartAmp);
    addDamped(out,t1+s2off,58,0.024,p.heartAmp*0.8);
    if(hasS3) addDamped(out,t1+s2off+0.15,36,0.03,p.heartAmp*0.5);
    if(hasMurmur){
      const a=Math.floor((t1+0.035)*SR), b=Math.floor((t1+s2off-0.015)*SR);
      for(let i=a;i<b&&i<N;i++){const u=(i-a)/(b-a);const env=hasMurmur.shape==='holosystolic'?Math.min(1,u*8,(1-u)*8):Math.sin(Math.PI*u);out[i]+=murNoise[i]*env*p.heartAmp*3}
    }
  }
  // --- adventitious sounds (pathological recording only)
  const nCyc=Math.ceil(SYN_DUR/T);
  for(const ev of path){
    for(let k=0;k<nCyc;k++){
      const c=k*T;
      if(ev.type==='fine_crackle'){
        const n=ev.density+Math.floor(rng()*3);
        for(let j=0;j<n;j++){const t=c+tIn*(ev.velcro?0.5+0.45*rng():0.55+0.4*rng());if(t<SYN_DUR)addDamped(out,t,620+rng()*220,0.0032,0.9+0.5*rng(),rng)}
      } else if(ev.type==='coarse_crackle'){
        const n=ev.density+Math.floor(rng()*2);
        for(let j=0;j<n;j++){const t=c+tIn*(0.08+0.6*rng());if(t<SYN_DUR)addDamped(out,t,180+rng()*80,0.0085,0.8+0.4*rng(),rng)}
      } else if(ev.type==='wheeze'||ev.type==='stridor'||ev.type==='rhonchus'){
        const insp=ev.phase==='insp'; const a=insp?c:c+tIn, d=insp?tIn:tEx;
        const freqs=ev.type==='rhonchus'?[160]:ev.type==='stridor'?[ev.freq||460]:ev.freqs;
        const amp=ev.type==='stridor'?0.55:ev.type==='rhonchus'?0.40:0.45;
        const i0=Math.floor(a*SR), i1=Math.min(N,Math.floor((a+d)*SR));
        const vib=0.4+rng()*0.4; const ph=freqs.map(()=>rng()*2*Math.PI);
        for(let i=i0;i<i1;i++){
          const t=i/SR,u=clamp((t-a)/d,0,1); const env=Math.pow(Math.max(0,Math.sin(Math.PI*u)),0.6);
          let v=0;
          freqs.forEach((f0,j)=>{
            const f=f0*(1+0.015*Math.sin(2*Math.PI*(4+vib)*t)); ph[j]+=2*Math.PI*f/SR; const P=ph[j];
            if(ev.type==='rhonchus'){v+=Math.sin(P)*(0.7+0.3*Math.sin(2*Math.PI*17*t))+0.5*Math.sin(2*P)+0.25*Math.sin(3*P)}
            else if(ev.type==='stridor'){v+=Math.sin(P)+0.45*Math.sin(2*P)+0.2*Math.sin(3*P)+white[i]*0.35}
            else v+=Math.sin(P)+0.15*Math.sin(2*P);
          });
          out[i]+=v*env*amp/Math.sqrt(freqs.length);
        }
      } else if(ev.type==='rub'){
        // reproducible creak trains: late inspiration and early expiration
        const trains=[[c+tIn*0.55,c+tIn*0.95],[c+tIn,c+tIn+tEx*0.4]];
        for(const [a,b] of trains){for(let t=a;t<b&&t<SYN_DUR;t+=0.055+0.01*Math.sin(t*9)){addDamped(out,t,170+40*Math.abs(Math.sin(t*13)),0.011,0.7,rng)}}
      }
    }
  }
  // --- normalise & soft clip
  let peak=0; for(let i=0;i<N;i++)peak=Math.max(peak,Math.abs(out[i]));
  const g=0.85/peak; for(let i=0;i<N;i++){const v=out[i]*g;out[i]=Math.tanh(v*1.2)/1.2}
  return out;
}

/* =====================================================================
   3. Signal analysis — FFT, envelopes, segmentation, anomaly detection
   ===================================================================== */
function fftMag(re){ // in-place radix-2 FFT, returns magnitude spectrum (N/2+1)
  const n=re.length, im=new Float64Array(n);
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t}}
  for(let len=2;len<=n;len<<=1){const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const a=i+k,b=a+len/2;const tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}
  const m=new Float32Array(n/2+1); for(let i=0;i<=n/2;i++)m[i]=Math.hypot(re[i],im[i]); return m;
}
const FR={N:256, HOP:80}; // 32 ms frames, 10 ms hop at 8 kHz
const HANN=Float64Array.from({length:FR.N},(_,i)=>0.5-0.5*Math.cos(2*Math.PI*i/FR.N));
const binHz=SR/FR.N;
function frameFeatures(x){
  const nF=Math.floor((x.length-FR.N)/FR.HOP)+1, t=new Float32Array(nF), rms=new Float32Array(nF), low=new Float32Array(nF), mid=new Float32Array(nF), high=new Float32Array(nF);

  const re=new Float64Array(FR.N);

    const o=f*FR.HOP; let e=0;
    for(let i=0;i<FR.N;i++){const v=x[o+i];re[i]=v*HANN[i];e+=v*v}
    const m=fftMag(re); specs[f]=m; t[f]=(o+FR.N/2)/SR; rms[f]=Math.sqrt(e/FR.N);
    let l=0,md=0,h=0; for(let k=1;k<bMid0;k++)l+=m[k]*m[k]; for(let k=bMid0;k<bMid1;k++)md+=m[k]*m[k]; for(let k=bMid1;k<=bHigh1;k++)h+=m[k]*m[k];

  const tLo=Math.round(TONAL_LO/binHz), tHi=Math.round(1300/binHz), nb=specs[0].length;
  const M=new Array(nF);
  for(let f=0;f<nF;f++){const m=new Float32Array(nb); const f0=Math.max(0,f-1),f1=Math.min(nF-1,f+1);
    for(let k=0;k<nb;k++){let v=0;for(let g=f0;g<=f1;g++)v+=specs[g][k];m[k]=v/(f1-f0+1)} M[f]=m}

}
function smooth(a, w){const out=new Float32Array(a.length);let s=0;const half=w>>1;for(let i=0;i<a.length;i++){s+=a[i];if(i>=w)s-=a[i-w];out[Math.max(0,i-half)]=s/Math.min(w,i+1)}for(let i=a.length-half;i<a.length;i++)out[i]=out[Math.max(0,a.length-half-1)];return out}

// Respiratory cycle segmentation from the breath envelope (mid+high band energy)
function segmentCycles(F){

    {const r=Math.round(0.25/dt);let b2=sp;for(let i=Math.max(pk+1,sp-r);i<=Math.min(e-1,sp+r);i++)if(env2[i]<env2[b2])b2=i;sp=b2}

function smoothEnv(F){return smooth(F.floor,Math.round(0.3/(FR.HOP/SR)))}
function energyEnv(F){const e=new Float32Array(F.nF);for(let i=0;i<F.nF;i++)e[i]=Math.sqrt(F.mid[i]+F.high[i]);return smooth(e,Math.round(0.08/(FR.HOP/SR)))}
function phaseOf(cycles,t){
  for(const c of cycles){if(c.single&&t>=c.start&&t<c.split){const u=(t-c.start)/(c.split-c.start);return {phase:'breath sound (phase uncertain)',pos:u<0.33?'early':u<0.66?'mid':'late',u,cycle:c}}
    if(t>=c.start&&t<c.end){if(t<c.split){const u=(t-c.start)/(c.split-c.start);return {phase:'inspiratory',pos:u<0.33?'early':u<0.66?'mid':'late',u,cycle:c}}const u=(t-c.split)/(c.end-c.split);return {phase:'expiratory',pos:u<0.33?'early':u<0.66?'mid':'late',u,cycle:c}}}
  return {phase:'unassigned',pos:'',u:0,cycle:null};
}
// LPC whitening: predictable (stationary / tonal) sound is removed, explosive transients remain
function lpcResidual(x, order=14, B=512){
  const y=new Float32Array(x.length); const a=new Float64Array(order+1), r=new Float64Array(order+1);
  for(let o=0;o<x.length;o+=B){
    const s=Math.max(0,o-B/2), e=Math.min(x.length,o+B+B/2);
    for(let k=0;k<=order;k++){let acc=0;for(let i=s+k;i<e;i++)acc+=x[i]*x[i-k];r[k]=acc}
    r[0]*=1.0001; a.fill(0); a[0]=1; let err=r[0]||1e-12;
    for(let i=1;i<=order;i++){let acc=r[i];for(let j=1;j<i;j++)acc+=a[j]*r[i-j];const k=-acc/err;const tmp=a.slice();for(let j=1;j<i;j++)a[j]=tmp[j]+k*tmp[i-j];a[i]=k;err*=(1-k*k);if(err<=0)break}
    for(let i=o;i<Math.min(x.length,o+B);i++){let v=x[i];for(let j=1;j<=order&&i-j>=0;j++)v+=a[j]*x[i-j];y[i]=v}
  }

const player={ctx:null,src:null,playing:false,which:null,startAt:0,offset:0,rate:1,loop:false,pos:0,raf:0,patientId:null,segEnd:null};

    const data=getAudio(p)[which]; const buf=ctx.createBuffer(1,data.length,SR); buf.copyToChannel(data,0);
    const src=ctx.createBufferSource(); src.buffer=buf; src.playbackRate.value=player.rate; src.loop=player.loop&&until==null; src.connect(ctx.destination);

    if(until!=null)src.start(0,from,until-from); else src.start(0,from);

  const total=patients.reduce((a,p)=>a+findingSummary(p).n,0), nReal=patients.filter(p=>p.source==='sprsound').length, nKauh=patients.filter(p=>p.source==='kauh').length, nRec=patients.reduce((a,p)=>a+(p.sites?p.sites.length:2),0);

async function decodeToSR(file,maxS){

  const len=Math.min(Math.round(dec.duration*SR),Math.round(maxS*SR));

/* ---------- Validation: one physician-readable report per detector (web/data/validation.json) ----------

   comes from pipeline/clinical_validation.py and pipeline/ml_validate.py (Seismometer statistics). */
const EVID={external:['pill ok','external validation','Thresholds were fixed before this data was seen — an honest estimate for similar patients.'],
  development:['pill warn','development data','Thresholds were tuned on this same data — optimistic; expect worse on new patients.'],
  pilot:['pill warn','pilot','External but small — the direction is informative, the exact number is not.'],
  research:['pill','research only','Not a clinical test; no clinical claim is made.']};
const ciTxt=m=>m.value==null?'—':`${m.value}${m.k!=null||m.label.match(/Sens|Spec|PPV|NPV|Prev|sensitivity|recogn/i)?' %':''}`;
const ciRange=m=>m.lo==null?'':`${m.lo} – ${m.hi}`;
let valCharts=[];
function valMetricRows(ms){return ms.map(m=>`<tr><td><b>${esc(m.label)}</b>${m.explain?`<div class="hint">${m.explain}</div>`:''}</td><td class="mono">${ciTxt(m)}</td><td class="mono">${ciRange(m)}</td><td class="mono">${m.k!=null&&m.n!=null?`${m.k} / ${m.n}`:m.n!=null?'n = '+m.n:''}</td></tr>`).join('')}
function lrBlock(r){if(!r.lrPos)return '';const w=v=>v>=10?'large':v>=5?'moderate':v>=2?'small':'minimal',wn=v=>v<=0.1?'large':v<=0.2?'moderate':v<=0.5?'small':'minimal';
  return `<tr><td><b>Positive likelihood ratio (LR+)</b><div class="hint">how much a positive result raises the odds — ${w(r.lrPos.value)} effect</div></td><td class="mono">${r.lrPos.value}</td><td class="mono">${r.lrPos.lo} – ${r.lrPos.hi}</td><td></td></tr>
    <tr><td><b>Negative likelihood ratio (LR−)</b><div class="hint">how much a negative result lowers the odds — ${wn(r.lrNeg.value)} effect</div></td><td class="mono">${r.lrNeg.value}</td><td class="mono">${r.lrNeg.lo} – ${r.lrNeg.hi}</td><td></td></tr>`}
function subTable(g){const hasSpec=g.rows.some(r=>r.spec);
  return `<h3 style="margin-top:12px">${esc(g.group)}</h3><table><thead><tr><th>Subgroup</th><th>Sensitivity (95 % CI)</th>${hasSpec?'<th>Specificity (95 % CI)</th>':''}</tr></thead><tbody>${g.rows.map(r=>`<tr><td>${esc(r.label)}</td><td class="mono">${ciTxt(r)} <span class="hint">${r.lo!=null?'('+ciRange(r)+') ':''}${r.k!=null?r.k+'/'+r.n:''}</span></td>${hasSpec?`<td class="mono">${r.spec?ciTxt(r.spec)+' <span class="hint">('+ciRange(r.spec)+') '+r.spec.k+'/'+r.spec.n+'</span>':'—'}</td>`:''}</tr>`).join('')}</tbody></table>
    ${(()=>{const tot=g.rows.reduce((a,r)=>a+(r.n||0),0);return g.rows.every(r=>r.n!=null)&&tot?`<p class="hint">Counts cover patients with this field recorded (${tot}).</p>`:''})()}`}
function reportCard(r,i){const E=EVID[r.evidence]||EVID.research;
  return `<div class="card vrep" id="v-${r.id}"><div class="row" style="justify-content:space-between;align-items:flex-start"><h2 style="margin:0">${i+1} · ${esc(r.title)}</h2><span class="${E[0]}" title="${esc(E[2])}">${E[1]}</span></div>
    <dl class="kv" style="margin-top:12px;grid-template-columns:190px 1fr">
      <dt>Clinical question</dt><dd>${esc(r.question)}</dd>

      <div>${r.metrics.some(m=>m.lo!=null)?`<div style="position:relative;height:${Math.max(150,r.metrics.filter(m=>m.lo!=null).length*34+50)}px"><canvas id="vc-${r.id}"></canvas></div><p class="hint">Bars = 95 % confidence interval, dot = estimate. A wide bar means the data cannot pin the number down.</p>`:''}</div></div>`:''}

function mlCard(m){const s=m.metrics,c=m.comparator,e=m.external;
  return `<div class="card vrep" id="v-${m.id}"><div class="row" style="justify-content:space-between;align-items:flex-start"><h2 style="margin:0">${esc(m.title)}</h2><span class="pill info">held-out test · research model</span></div>

      <dt>Operating point</dt><dd>score ≥ ${m.threshold}, fixed on the training patients to reach ${Math.round(100*VAL.ml.protocol.targetSpec)} % specificity — not adjusted on the test patients</dd>

      <tr><td><b>ROC AUC</b></td><td class="mono">${m.testAuc.value} <span class="hint">(${m.testAuc.lo} – ${m.testAuc.hi})</span></td>${c?'<td class="hint">binary rule — no AUC</td>':''}${e?`<td class="mono">${e.auc.value} <span class="hint">(${e.auc.lo} – ${e.auc.hi})</span></td>`:''}</tr>
      ${s.map((x,i)=>`<tr><td><b>${x.label}</b></td><td class="mono">${ciTxt(x)} <span class="hint">(${ciRange(x)}) ${x.k}/${x.n}</span></td>${c?`<td class="mono">${ciTxt(c.metrics[i])} <span class="hint">(${ciRange(c.metrics[i])})</span></td>`:''}${e?`<td class="mono">${ciTxt(e.metrics[i])} <span class="hint">(${ciRange(e.metrics[i])})</span></td>`:''}</tr>`).join('')}
      <tr><td><b>LR+ / LR−</b></td><td class="mono">${m.lrPos} / ${m.lrNeg}</td>${c?`<td class="mono">${c.lrPos} / ${c.lrNeg}</td>`:''}${e?'<td></td>':''}</tr></tbody></table></div>

    ${m.fairness.map(f=>`<table style="margin-bottom:8px"><thead><tr><th>${esc(f.cohort)}</th><th>n (with finding)</th><th>Sensitivity</th><th>Specificity</th><th>Flag</th></tr></thead><tbody>${f.rows.map(r=>`<tr><td>${esc(r.group)}${r.reference?' <span class="tag">reference</span>':''}</td><td class="mono">${r.n} (${r.positives})</td><td class="mono">${ciTxt(r.sens)} <span class="hint">(${ciRange(r.sens)})</span></td><td class="mono">${ciTxt(r.spec)} <span class="hint">(${ciRange(r.spec)})</span></td><td>${r.flags.length?r.flags.map(x=>`<span class="pill ${/critical/.test(x)?'bad':'warn'}">${esc(x)}</span>`).join(' '):'<span class="hint">—</span>'}</td></tr>`).join('')}</tbody></table>`).join('')}
    <h3>What this means at the bedside</h3><ul class="bedside">${m.bedside.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
    <p class="hint">${esc(m.note)}</p></div>`}

    <div class="card tablecard vrep" style="margin-bottom:16px"><table><thead><tr><th>Finding</th><th>Evidence</th><th>Sensitivity (95 % CI)</th><th>Specificity (95 % CI)</th><th>LR+ / LR−</th><th>Verdict</th></tr></thead><tbody>${R.map(row).join('')}</tbody></table></div>
